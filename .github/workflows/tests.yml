name: API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: sistema_estoque_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sistema_estoque_test
      DB_USER: postgres
      DB_PASSWORD: teste
      JWT_SECRET_KEY: chave-jwt-exclusiva-para-testes-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          set -o pipefail
          pytest -v -rf --tb=short | tee pytest.log

      - name: Annotate failed tests
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while read -r linha; do
            echo "::error title=Teste falhou::${linha}"
          done
          grep -E "^E  " pytest.log | head -20 | while read -r linha; do
            echo "::error title=Detalhe::${linha}"
          done

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for Docker
        run: |
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=senha-ci/" .env
          sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=chave-ci-docker/" .env

      - name: Build and start containers
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check API, frontend and migrations
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent http://localhost:8000/app/ | grep -q "Estoque"
          docker compose exec -T db psql -U postgres -d sistema_estoque -tAc "SELECT version_num FROM alembic_version" | grep -q "0003"
          curl --fail --silent -X POST http://localhost:8000/usuarios \
            -H "Content-Type: application/json" \
            -d '{"nome":"Admin CI","email":"admin@ci.com","senha":"senha12345"}' | grep -q ADMINISTRADOR

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
