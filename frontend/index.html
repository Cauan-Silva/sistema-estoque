<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1745">
  <title>Estoque e Compras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var tema = localStorage.getItem("estoque.tema");
      if (tema === "claro" || tema === "escuro") document.documentElement.dataset.tema = tema;
    } catch (erro) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="avisos" class="avisos" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
